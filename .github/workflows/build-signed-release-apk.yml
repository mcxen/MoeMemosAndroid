name: Build Signed Release APK

# Automatic release when you push a version tag, e.g.:
#   git tag 2.0.5 && git push origin 2.0.5
# Or run manually from Actions → "Build Signed Release APK" → Run workflow.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match app versionName), e.g. 2.0.5 or 2.0.5-beta.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Tag/version '$TAG' is not supported. Expected: 0.9.0, 0.9.0-alpha.0, or 0.9.0-beta.0"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch, checkout default branch (main)
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            echo "Set repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_SIGNING_STORE_PASSWORD,"
            echo "ANDROID_SIGNING_KEY_ALIAS, ANDROID_SIGNING_KEY_PASSWORD"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          ls -la "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for var_name in ANDROID_SIGNING_STORE_FILE ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Missing required signing value: ${var_name}"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease --no-daemon
          # Ensure APK is signed (not plain unsigned)
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK not found at $APK_PATH"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          # apksigner is in Android SDK build-tools after Gradle/AGP download, or use jarsigner
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK_PATH" || true
          fi
          jarsigner -verify -verbose -certs "$APK_PATH" | head -20 || true

      - name: Package APK artifact
        id: package
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          OUT="moememos-v${TAG}.apk"
          cp "$APK_PATH" "$OUT"
          ls -lh "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moememos-v${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.package.outputs.apk }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          # Create the tag on workflow_dispatch if it does not exist yet
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
